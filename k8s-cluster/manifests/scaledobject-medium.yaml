apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker-medium
  namespace: notifications
spec:
  scaleTargetRef:
    name: worker-medium
  minReplicaCount: 0
  maxReplicaCount: 2
  cooldownPeriod: 300
  triggers:
    - type: aws-sqs-queue
      metadata:
        queueURL: "__QUEUE_URL_MEDIUM__"
        queueLength: "5"
        awsRegion: "__AWS_REGION__"
        identityOwner: operator
