apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker-high
  namespace: notifications
spec:
  scaleTargetRef:
    name: worker-high
  minReplicaCount: 0
  maxReplicaCount: 5
  cooldownPeriod: 300
  triggers:
    - type: aws-sqs-queue
      metadata:
        queueURL: "__QUEUE_URL_HIGH__"
        queueLength: "5"
        awsRegion: "__AWS_REGION__"
        identityOwner: operator
