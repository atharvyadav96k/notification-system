apiVersion: apps/v1
kind: Deployment

metadata:
  name: notification-worker
  namespace: notification-system

spec:
  selector:
    matchLabels:
      app: notification-worker

  template:
    metadata:
      labels:
        app: notification-worker

    spec:
      containers:
        - name: notification-worker

          image: localhost:5000/notification-worker:v3
          imagePullPolicy: Always

          env:
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-conn
                  key: RABBITMQ_URL

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"