name: Deploy Notification System

on:
  push:
    branches:
      - main

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      sqs-high: ${{ steps.filter.outputs.sqs-high }}
      sqs-medium: ${{ steps.filter.outputs.sqs-medium }}
      sqs-low: ${{ steps.filter.outputs.sqs-low }}
      function: ${{ steps.filter.outputs.function }}
      worker: ${{ steps.filter.outputs.worker }}
      k8s-cluster: ${{ steps.filter.outputs.k8s-cluster }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Detect Changed Paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            sqs-high:
              - 'sqs/high/**'
            sqs-medium:
              - 'sqs/medium/**'
            sqs-low:
              - 'sqs/low/**'
            function:
              - 'functions/end-point/**'
            worker:
              - 'workers/consumer/**'
            k8s-cluster:
              - 'k8s-cluster/**'

  deploy:
    needs: changes
    if: needs.changes.outputs.sqs-high == 'true' || needs.changes.outputs.sqs-medium == 'true' || needs.changes.outputs.sqs-low == 'true' || needs.changes.outputs.function == 'true' || needs.changes.outputs.worker == 'true' || needs.changes.outputs.k8s-cluster == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        if: needs.changes.outputs.function == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: SQS High Terraform Init
        if: needs.changes.outputs.sqs-high == 'true'
        working-directory: sqs/high
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=state/notification-sqs-high/terraform.tfstate" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}"

      - name: SQS High Terraform Apply
        if: needs.changes.outputs.sqs-high == 'true'
        working-directory: sqs/high
        env:
          TF_VAR_region: ${{ secrets.AWS_REGION }}
          TF_VAR_SQS_NAME: ${{ vars.QUEUE_NAME }}
        run: terraform apply -auto-approve

      - name: SQS Medium Terraform Init
        if: needs.changes.outputs.sqs-medium == 'true'
        working-directory: sqs/medium
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=state/notification-sqs-medium/terraform.tfstate" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}"

      - name: SQS Medium Terraform Apply
        if: needs.changes.outputs.sqs-medium == 'true'
        working-directory: sqs/medium
        env:
          TF_VAR_region: ${{ secrets.AWS_REGION }}
          TF_VAR_SQS_NAME: ${{ vars.QUEUE_NAME }}
        run: terraform apply -auto-approve

      - name: SQS Low Terraform Init
        if: needs.changes.outputs.sqs-low == 'true'
        working-directory: sqs/low
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=state/notification-sqs-low/terraform.tfstate" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}"

      - name: SQS Low Terraform Apply
        if: needs.changes.outputs.sqs-low == 'true'
        working-directory: sqs/low
        env:
          TF_VAR_region: ${{ secrets.AWS_REGION }}
          TF_VAR_SQS_NAME: ${{ vars.QUEUE_NAME }}
        run: terraform apply -auto-approve

      - name: Setup go for the end point
        if: needs.changes.outputs.function == 'true'
        run: |
          cd functions/end-point
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o bootstrap .
          zip function.zip bootstrap

      - name: Endpoint Function Terraform Init
        if: needs.changes.outputs.function == 'true'
        working-directory: functions/end-point
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=state/notification-publisher/terraform.tfstate" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \

      - name: Endpoint Function Terraform Apply
        if: needs.changes.outputs.function == 'true'
        working-directory: functions/end-point
        env:
          TF_VAR_region: ${{ secrets.AWS_REGION }}
          TF_VAR_state_bucket: ${{ secrets.TF_STATE_BUCKET }}
          TF_VAR_lambda_role_arn: ${{ secrets.LAMBDA_ROLE_ARN }}
          TF_VAR_function-name: notification-publisher
          TF_VAR_SQS_NAME: ${{ vars.QUEUE_NAME }}
        run: terraform apply -auto-approve

      - name: Docker Login
        if: needs.changes.outputs.worker == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build Worker
        if: needs.changes.outputs.worker == 'true'
        uses: docker/build-push-action@v5
        with:
          context: workers/consumer
          push: true
          tags: ${{ secrets.DOCKER_USER }}/worker:latest

      - name: K8s Cluster Terraform Init
        if: needs.changes.outputs.k8s-cluster == 'true' || needs.changes.outputs.worker == 'true'
        working-directory: k8s-cluster
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=state/k8s-cluster/terraform.tfstate" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}"

      - name: K8s Cluster Terraform Apply
        if: needs.changes.outputs.k8s-cluster == 'true'
        working-directory: k8s-cluster
        env:
          TF_VAR_region: ${{ secrets.AWS_REGION }}
          TF_VAR_state_bucket: ${{ secrets.TF_STATE_BUCKET }}
        run: terraform apply -auto-approve

      - name: Apply k8s manifests
        if: needs.changes.outputs.k8s-cluster == 'true' || needs.changes.outputs.worker == 'true'
        working-directory: k8s-cluster
        run: |
          INSTANCE_ID=$(terraform output -raw k3s_server_instance_id)
          QUEUE_URL_HIGH=$(terraform output -json queue_urls | jq -r .high)
          QUEUE_URL_MEDIUM=$(terraform output -json queue_urls | jq -r .medium)
          QUEUE_URL_LOW=$(terraform output -json queue_urls | jq -r .low)

          cat manifests/*.yaml | \
            sed "s#__DOCKER_IMAGE__#${{ secrets.DOCKER_USER }}/worker:latest#g" | \
            sed "s#__QUEUE_URL_HIGH__#$QUEUE_URL_HIGH#g" | \
            sed "s#__QUEUE_URL_MEDIUM__#$QUEUE_URL_MEDIUM#g" | \
            sed "s#__QUEUE_URL_LOW__#$QUEUE_URL_LOW#g" | \
            sed "s#__AWS_REGION__#${{ secrets.AWS_REGION }}#g" > /tmp/notification-manifests.yaml

          jq -n \
            --rawfile manifest /tmp/notification-manifests.yaml \
            '{commands: [
              "export KUBECONFIG=/etc/rancher/k3s/k3s.yaml",
              ("cat > /tmp/notification-manifests.yaml <<'"'"'K8S_MANIFEST_EOF'"'"'\n" + $manifest + "K8S_MANIFEST_EOF"),
              "kubectl apply -f /tmp/notification-manifests.yaml",
              "kubectl rollout restart deployment -n notifications --all"
            ]}' > /tmp/ssm-params.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)

          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
